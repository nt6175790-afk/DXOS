server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  access_log off;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  location / { try_files $uri $uri/ /index.html; }
}
