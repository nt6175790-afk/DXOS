Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogVerbose no
LogClean no
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 30M
MaxScanTime 15000
MaxRecursion 10
MaxFiles 1000
MaxThreads 4
ReadTimeout 30
CommandReadTimeout 10
SelfCheck 600
AlertEncrypted yes
