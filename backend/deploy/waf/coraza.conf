Include @coraza.conf-recommended
Include @crs-setup.conf.example
# OIDC issuer is an identifier, never fetched from client input. Backend verifies
# exact configured issuer plus signed state/nonce. Exclude only this JSON field
# from SSRF URL heuristics on the SSO exchange endpoint; keep every other rule.
SecRule REQUEST_URI "@streq /api/v1/auth/sso/complete" "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:json.iss,ctl:ruleRemoveTargetByTag=attack-ssrf;ARGS:iss"
Include @owasp_crs/*.conf
SecRuleEngine On
SecRequestBodyLimit 6291456
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0
