name: DX-OS verification and security
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: dx_os_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      # Ephemeral runner only; never reuse this empty-password DB configuration in deployment.
      DATABASE_URL: mysql://root@127.0.0.1:3306/dx_os_ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22.21.1", cache: npm, cache-dependency-path: "package-lock.json" }
      - run: npm ci
      - run: node --test backend/scripts/check-source-licenses.test.js
      - run: node backend/scripts/check-source-licenses.js
      - run: node --test backend/scripts/source-publication-policy.test.js
      - run: node --test backend/scripts/init-demo-env.test.js
      - run: node --test backend/scripts/check-adguard-artifact.test.js
      - run: npm run db:generate && npm run db:validate
      - run: npm run lint:backend
      - run: npm run test:rbac:mysql --workspace @dx-os/backend -- --coverage
      - name: Evaluate offline agent against the agreed roles in a separate disposable database
        run: npm run test:rbac:mysql --workspace @dx-os/backend -- --testRegex 'ai-agent[.]eval[.]ts$'
      - run: npm run build:backend
      - run: node backend/scripts/test-oidc-protocol.js
      - run: node backend/scripts/audit-licenses.js --strict
      - name: Collect legal notice evidence (missing texts stay visible)
        run: node backend/scripts/collect-license-notices.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci && npm run lint && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Verify redirect dependency credential boundaries
        run: node --test backend/scripts/redirect-dependency-security.test.js
      - name: Collect notices for actual Linux installation
        run: |
          node backend/scripts/collect-license-notices.js --fetch-missing
          node backend/scripts/review-declared-licenses.js
          node backend/scripts/collect-license-notices.js --strict
      - name: OSS quality gate (Sonar replacement)
        run: node backend/scripts/run-quality-local.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            coverage/lcov.info
            security-artifacts/npm-licenses.json
            security-artifacts/quality-*
            licenses/
          if-no-files-found: warn

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work aquasec/trivy:0.76.0
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs outputs --skip-dirs .git .
      - name: Build selected OSS runtime images
        run: |
          docker build -f backend/deploy/backend.Dockerfile -t dxos-security-backend .
          docker build -f backend/deploy/frontend.Dockerfile -t dxos-security-frontend .
          docker build -f backend/deploy/openbao.Dockerfile -t dxos-security-openbao-oss .
          docker build -f backend/deploy/valkey.Dockerfile -t dxos-security-valkey-oss .
          docker build -f backend/deploy/clamav.Dockerfile -t dxos-security-clamav-oss .
          docker build -f backend/deploy/apisix.Dockerfile -t dxos-security-apisix-oss .
          docker build -f backend/deploy/waf.Dockerfile -t dxos-security-waf-oss .
          docker build -f backend/deploy/keycloak.Dockerfile -t dxos-security-keycloak .
      - uses: actions/setup-node@v7
        with: { node-version: "22.21.1" }
      - name: Verify the patched Keycloak runtime with an isolated S256 login
        run: node backend/scripts/test-keycloak-image.js
      - run: node backend/scripts/scan-runtime-images.js --images-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-sbom-and-scans
          path: |
            security-artifacts/runtime-*
            security-artifacts/keycloak-live-smoke.json

  source-demo:
    name: Build and run from exact source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22.21.1" }
      - name: Export only the tested Git revision
        run: |
          mkdir -p "$RUNNER_TEMP/dxos-release-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/dxos-release-source"
      - name: Initialize isolated demo without operator credentials
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: |
          node backend/scripts/init-demo-env.js
          docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml config --quiet
      - name: Compile source and start fresh infrastructure
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: |
          docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml build
          docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml up -d --wait --wait-timeout 240
      - name: Refresh demo dates without resetting credentials or grants
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml run --rm bootstrap node node_modules/tsx/dist/cli.mjs --tsconfig backend/tsconfig.json backend/scripts/demo-container-seed.ts
      - name: Verify migration, seed, login, attendance and tenant isolation
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: node backend/scripts/test-demo-live.js
      - name: Audit the isolated demo database image
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: |
          mkdir -p security-artifacts
          mysql_container=$(docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml ps -q mysql)
          mysql_image=$(docker inspect --format '{{.Image}}' "$mysql_container")
          test "${mysql_image#sha256:}" != "$mysql_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/security-artifacts:/out" aquasec/trivy:0.76.0 image --timeout 15m --scanners vuln --format json --output /out/demo-mysql-vulnerabilities.json --severity HIGH,CRITICAL --exit-code 1 "$mysql_image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/security-artifacts:/out" aquasec/trivy:0.76.0 image --timeout 15m --format cyclonedx --output /out/demo-mysql.cdx.json "$mysql_image"
      - name: Safe startup diagnostics
        if: failure()
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml logs --no-color --tail 40 bootstrap backend frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-demo-smoke
          path: ${{ runner.temp }}/dxos-release-source/security-artifacts/demo-*.json
          if-no-files-found: warn
      - name: Stop isolated demo (runner volumes are disposable)
        if: always()
        working-directory: ${{ runner.temp }}/dxos-release-source
        run: |
          if test -f .secrets/demo/compose.env; then
            docker compose -p dxos-ci-demo --env-file .secrets/demo/compose.env -f backend/deploy/compose.demo.yml down
          fi
